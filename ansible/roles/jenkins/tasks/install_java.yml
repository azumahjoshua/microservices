---
- name: Install Java (JDK 21/17)
  block:
    - name: Add Java repository
      apt_repository:
        repo: "ppa:openjdk-r/ppa"
        state: present
      tags: [java, repo]

    - name: Update package cache
      apt:
        update_cache: yes
      tags: [java, update]

    - name: Attempt to install JDK 21 (latest LTS)
      apt:
        name: openjdk-21-jdk
        state: present
      register: java_install
      ignore_errors: yes
      tags: [java, install]

    - name: Fallback to JDK 17 if needed
      apt:
        name: openjdk-17-jdk
        state: present
      when: java_install is failed
      register: java_fallback
      tags: [java, fallback]

    - name: Set JAVA_HOME dynamically
      lineinfile:
        path: /etc/environment
        line: "JAVA_HOME={{ java_home_path }}"
        regexp: "^JAVA_HOME="
        state: present
      vars:
        java_home_path: >-
          {% if java_install is success %}
          /usr/lib/jvm/java-21-openjdk-amd64
          {% elif java_fallback is success %}
          /usr/lib/jvm/java-17-openjdk-amd64
          {% endif %}
      tags: [java, env]

    - name: Verify Java installation
      command: java -version
      register: java_version
      changed_when: false
      failed_when: false
      tags: [java, verify]

    - name: Show Java version
      debug:
        msg: "Java installed: {{ java_version.stderr }}"
      tags: [java, debug]
  tags: [java]

  
