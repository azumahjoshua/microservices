---
- name: Install Python Flask stack
  block:
    - name: Install Python and pip
      apt:
        name: ["python3", "python3-pip"]
        state: present
    
    - name: Install Flask via pip
      pip:
        name: ["flask==3.1.0", "gunicorn==20.1.0"]

  tags: [python, flask, install]


